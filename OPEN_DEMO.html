 <div class="insight"><strong>A planning question:</strong> How would a recovery desk prepare for the kinds of building damage recorded in ${state.county} after ${state.storm}? Compare another storm before drawing a conclusion.</div><div class="action-row"><button class="primary" id="export-button">↓ Export county comparison</button><button class="secondary" id="print-button">Print brief</button></div><div class="download-status" role="status" id="download-status"></div></div></section>
 <section class="bottom-grid"><div class="card chart"><h3>Same county. Different recovery burden.</h3><p>Historical median building damage per eligible claim · ${state.county}</p>${comparison.map(x=>`<div class="barrow ${x.storm===state.storm?'active':''}"><span>${x.storm}<small>${x.year} · ${num(x.claims)} claims</small></span><div class="bartrack"><div class="barfill" style="width:${x.claims>=20?x.median_damage/maxMedian*100:0}%"></div></div><span class="barvalue">${x.claims>=20?money(x.median_damage):'Too few'}</span></div>`).join('')}<p class="chart-note">Storms have different claims, weather windows, and policy contexts. This is a descriptive comparison; it does not measure how likely a home is to flood.</p></div><div class="card chart"><h3>What the rainfall record shows</h3><p>${state.county} reference point · Six-hour rainfall accumulation</p>${weatherSvg()}<p class="chart-note">${r.weather_start.slice(0,10)} to ${r.weather_end.slice(0,10)} · ${r.hours} hours. Historical reanalysis at a single sampling location. Windows differ between storms.</p><div class="links"><a href="#evidence" data-open="evidence">How we checked the model ↗</a><a href="${D.sources.folder}" target="_blank" rel="noopener">Organizer datasets ↗</a></div></div></section><p class="data-note"><strong>What’s included:</strong> Single-family claim records with known nonnegative building damage and building coverage of $1–$250,000. Amounts describe assessed structural damage, separate from insurance payments and contents damage. Damage summaries with fewer than 20 claims are suppressed. <a href="#evidence" data-open="evidence">Read the methods and limits.</a></p>`;
}
// blend the four saved predictions around the typed depth and coverage
function estimate(){
 const pick=(list,v)=>{let i=0;while(i<list.length-2&&v>list[i+1])i++;return [i,(v-list[i])/(list[i+1]-list[i])];};
 const [di,dt]=pick(P.depths,est.depth),[ci,ct]=pick(P.coverages,est.coverage);
 const at=(d,c)=>{const g=P.grid.find(r=>r[0]===est.storm&&r[1]===est.county&&r[2]===est.zone&&r[3]===P.depths[d]&&r[4]===P.coverages[c]);return g?g[5]:null;};
 const v00=at(di,ci),v10=at(di+1,ci),v01=at(di,ci+1),v11=at(di+1,ci+1);
 if([v00,v10,v01,v11].includes(null))return null;
 return (v00*(1-dt)+v10*dt)*(1-ct)+(v01*(1-dt)+v11*dt)*ct;
}
function predict(){const m=P.mixed_test,u=P.unseen_storm_test,value=estimate(),hist=row(est.storm,est.county),maxCounty=Math.max(...P.counties.map(c=>c.total)),maxImp=Math.max(...Object.values(P.importance));
 return `<div class="page-intro"><div class="eyebrow">WHERE SHOULD HELP GO FIRST?</div><h1>Estimate the damage<br>before the claims arrive.</h1><p>Insurance claims take weeks. Our model estimates a flooded home’s building damage from its water depth, flood zone, coverage, county, and the storm’s rain and wind. Added up by zip code, it shows recovery teams where to send inspectors and aid first.</p></div>
 <section class="metrics" aria-label="Model scorecard"><div class="metric accent"><div class="label">LESS ERROR ON HOMES IT NEVER SAW</div><strong>${Math.round(m.improvement_pct)}%</strong><small>${money(m.model_mae)} vs ${money(m.baseline_mae)} baseline · ${num(m.test_n)} test homes</small></div><div class="metric"><div class="label">LESS ERROR ON A STORM IT NEVER SAW</div><strong>${Math.round(u.improvement_pct)}%</strong><small>Beryl 2024 · ${money(u.model_mae)} vs ${money(u.baseline_mae)} baseline</small></div><div class="metric"><div class="label">STRONGEST SIGNAL</div><strong>${Object.keys(P.importance)[0]}</strong><small>Biggest driver of building damage</small></div><div class="metric"><div class="label">HOMES THE MODEL LEARNED FROM</div><strong>${num(P.eligible_n)}</strong><small>Single-family claims with known water depth</small></div></section>
 <section class="main-grid"><div class="card detail"><div class="detail-top"><div><div class="eyebrow" style="font-size:8px;letter-spacing:1.5px;margin-bottom:7px">TRY THE MODEL</div><h2>Estimate one home</h2></div></div>
 <label class="field" for="est-storm">Storm conditions<select id="est-storm">${Object.keys(D.storm_years).map(s=>`<option value="${s}" ${s===est.storm?'selected':''}>${stormNames[s]} (${D.storm_years[s]})</option>`).join('')}</select></label>
 <label class="field" for="est-county">County<select id="est-county">${Object.values(D.counties).map(c=>`<option ${c===est.county?'selected':''}>${c}</option>`).join('')}</select></label>
 <label class="field" for="est-zone">Flood zone<select id="est-zone"><option value="X" ${est.zone==='X'?'selected':''}>Zone X (“low risk”)</option><option value="AE" ${est.zone==='AE'?'selected':''}>Zone AE (high risk)</option><option value="OTHER" ${est.zone==='OTHER'?'selected':''}>Other / unknown</option></select></label>
 <label class="field" for="est-depth">Water inside the home (feet, 0–30)<input type="number" id="est-depth" min="0" max="30" step="0.1" value="${est.depth}" inputmode="decimal"></label>
 <label class="field" for="est-coverage">Building coverage in dollars ($10,000–$250,000, a stand-in for home value)<input type="number" id="est-coverage" min="10000" max="250000" step="1000" value="${est.coverage}" inputmode="numeric"></label>
 <div class="observed"><span class="label">PREDICTED BUILDING DAMAGE</span><div class="value">${value==null?'—':money(value)}</div><p>${est.depth} ft of water · ${money(est.coverage)} coverage</p><p>${hist&&hist.claims>=20?`Recorded median for ${est.county} after ${est.storm}: ${money(hist.median_damage)} across ${num(hist.claims)} claims`:'Too few recorded claims to compare'}</p></div>
 <div class="insight"><strong>Try this:</strong> keep Zone X and change the water depth from 1 to 4 feet. “Low risk” zones still see serious damage, and many of those owners skip flood insurance.</div></div>
 <div class="card chart"><h3>If Harvey hit again: where help goes first</h3><p>Every eligible home given Harvey’s rain and wind for its county · Predicted building damage</p>
 ${P.counties.map(c=>`<div class="barrow"><span>${c.county}<small>${num(c.homes)} homes · ${money(c.average)} avg</small></span><div class="bartrack"><div class="barfill" style="width:${c.total/maxCounty*100}%"></div></div><span class="barvalue">${compact(c.total)}</span></div>`).join('')}
 <table class="evidence-table"><thead><tr><th>Priority zip code</th><th>Homes</th><th>Avg. damage</th><th>Total</th></tr></thead><tbody>${P.zips.map((z,i)=>`<tr><td>${i+1}. ${z.zip} <small>${z.county}</small></td><td>${num(z.homes)}</td><td>${money(z.average)}</td><td>${compact(z.total)}</td></tr>`).join('')}</tbody></table>
 <p class="chart-note">Covers homes that appear in the claim records, not every home in Houston. Zip codes with fewer than 20 eligible homes are left out.</p></div></section>
 <section class="bottom-grid"><div class="card chart"><h3>What drives the damage</h3><p>How much the model relies on each kind of input</p>${Object.entries(P.importance).map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bartrack"><div class="barfill" style="width:${v/maxImp*100}%"></div></div><span class="barvalue">${Math.round(v*100)}%</span></div>`).join('')}<p class="chart-note">Water depth matters most, which matches how flood damage works.</p></div>
 <div class="card chart"><h3>How we tested it</h3><table class="evidence-table"><tbody><tr><td><strong>Test 1</strong> · 20% of homes held out</td><td>${Math.round(m.improvement_pct)}% less error than baseline · R² ${m.r2.toFixed(2)}</td></tr><tr><td><strong>Test 2</strong> · Beryl held out entirely</td><td>${Math.round(u.improvement_pct)}% less error than the old-storm baseline</td></tr><tr><td>Beryl: predicted typical damage</td><td>Close to actual, learned without seeing Beryl</td></tr><tr><td>Beryl: predictions of $0</td><td>${pct(u.zero_share)} (first model: 100%)</td></tr></tbody></table><p class="chart-note"><strong>Honest limit:</strong> on a brand-new storm the model gets the overall damage level right, but ranking individual homes is still rough (R² ${u.r2.toFixed(2)}). With only four storms, the next step is more storms and data on every home, not just insured ones.</p><div class="links"><a href="#evidence" data-open="evidence">See our first model and why we rejected it ↗</a></div></div></section>`;}
function evidence(){const m=D.metrics,a=D.audit;
 return `<div class="page-intro"><div class="eyebrow">EVIDENCE BEFORE ESTIMATES</div><h1>A model should earn<br>your confidence.</h1><p>Our first model left out water depth. We trained it on Harvey and Imelda, chose it using Nicholas, then tested it on Beryl, and it failed. That failure told us what was missing. The final model on the Predict damage page adds water depth and passes the Beryl test.</p></div><div class="warning"><strong>First model rejected</strong>Every Beryl prediction was clipped to $0. Its lower error against a $68,509 training-median baseline was misleading: predicting zero produced the same result. These outputs are archived for inspection. <a href="#predict" data-open="predict">See the final model →</a></div>
 <section class="evidence-grid"><article class="card panel"><span class="source-tag">01 · MODEL DESIGN</span><h2 style="margin-top:16px">Separate storms, separate roles</h2><div class="split"><div><strong>Train</strong><small>Harvey + Imelda<br>${num(m.train_n)} claims</small></div><div><strong>Select</strong><small>Nicholas 2021<br>${num(m.validation_n)} claims</small></div><div><strong>Test</strong><small>Beryl 2024<br>${num(m.test_n)} claims</small></div></div><p>The target was assessed building damage per eligible claim. Inputs were county, recorded flood zone, insurance coverage, total window rainfall, and peak wind gust. Training weights gave Harvey and Imelda equal total influence.</p><p>We excluded payouts, assessed damage, loss dates, storm names, and reported indoor water depth from the input features. We joined weather to claims once per storm and county using a validated many-to-one join.</p><p><strong>Important:</strong> Full-window historical weather makes this a retrospective experiment. It is not a forecast backtest.</p></article>
 <article class="card panel"><span class="source-tag">02 · VALIDATION</span><h2 style="margin-top:16px">What the numbers actually say</h2><table class="evidence-table"><thead><tr><th>Candidate</th><th>Nicholas average error</th></tr></thead><tbody>${m.validation_candidates.map(x=>`<tr><td>${escapeText(x.model)}</td><td>${money(x.mae)}</td></tr>`).join('')}</tbody></table><table class="evidence-table"><thead><tr><th>Beryl final check</th><th>Result</th></tr></thead><tbody><tr><td>Ridge average absolute error</td><td>${money(m.test_model.mae)}</td></tr><tr><td>Training-median baseline error</td><td>${money(m.test_baseline.mae)}</td></tr><tr><td>Always-zero diagnostic error</td><td>${money(m.zero_prediction_baseline_mae)}</td></tr><tr><td>Ridge predictions clipped to zero</td><td>${pct(m.test_zero_prediction_share)}</td></tr><tr><td>R² on Beryl</td><td>${m.test_model.r2.toFixed(3)}</td></tr></tbody></table><p>A negative R² and collapsed outputs are reasons to reject the model. The 61% reduction against the training-median baseline is not evidence of useful prediction.</p></article>
 <article class="card panel"><span class="source-tag">03 · DATA QUALITY</span><h2 style="margin-top:16px">From source records to usable evidence</h2><table class="evidence-table"><tbody><tr><td>All supplied claim records</td><td>${num(a.raw_claims)}</td></tr><tr><td>Four storms, single-family claims</td><td>${num(a.selected_single_family_claims)}</td></tr><tr><td>Missing damage in that group</td><td>${num(a.missing_damage_in_selected)}</td></tr><tr><td>Final eligible records</td><td>${num(a.model_claims)}</td></tr><tr><td>County and storm weather groups</td><td>${a.weather_groups}</td></tr><tr><td>Hourly weather rows</td><td>${num(a.weather_rows)}</td></tr></tbody></table><p>Missing damage stays missing and is excluded. County FIPS are five-character strings. Occupancy codes 1 and 11 are combined as single-family homes. Exact duplicate checks were run, but no unique property or claim ID was supplied.</p><p>All four organizer files were inspected. Hurricane tracks provide historical context; the nine-county boundary file supports the map. Neither file is used as an extra damage label.</p></article>
 <article class="card panel"><span class="source-tag">04 · PRACTICAL LIMITS</span><h2 style="margin-top:16px">Use the record with care</h2><ul>${D.limitations.map(x=>`<li>${escapeText(x)}</li>`).join('')}</ul><p><strong>Next experiment:</strong> Obtain more independent storms, consistent exposure data, property characteristics, and forecast-time weather. Test against stronger baselines and retain a fresh storm for final evaluation.</p></article><article class="card panel wide"><h3>Sources and reproducibility</h3><p>Data supplied in the organizer’s shared folder on October 23, 2026. The brief attributes the claims to OpenFEMA, weather to Open-Meteo ERA5, tracks to NOAA IBTrACS, and boundaries to the U.S. Census Bureau. The downloadable project includes source-file hashes, cleaning rules, fitted models, metrics, and the analysis notebook.</p><div class="links"><a href="${D.sources.folder}" target="_blank" rel="noopener">Shared source folder ↗</a><a href="${D.sources.brief}" target="_blank" rel="noopener">Organizer dataset brief ↗</a><a href="https://scikit-learn.org/stable/modules/model_evaluation.html" target="_blank" rel="noopener">Metric definitions ↗</a></div></article></section>`;
}
function present(){return `<div class="page-intro"><div class="eyebrow">YOUR TWO-MINUTE WALKTHROUGH</div><h1>You can explain this<br>without knowing how to code.</h1><p>Open Explore storms before the judges arrive. Start with Beryl and Harris County. This guide gives you the story, the clicks, and clear answers.</p></div><section class="evidence-grid"><article class="card panel"><h2>The live demo</h2>${[
 ['0:00','The problem','“Houston’s storms leave very different recovery needs. We wanted a clearer way to understand the building damage recorded after them.”'],
 ['0:20','Show the county map','“Recovery Lens joins the organizer’s flood claims, weather, and county boundaries. It covers four storms and five counties with matched data.”'],
 ['0:40','Compare Beryl and Harvey','Click Harvey, then Beryl. “For the same county, we can compare the median damage recorded per eligible claim. We show the claim count and weather window so the comparison has context.”'],
 ['0:55','Inspect Zone X','Choose Zone X. “Some recorded claims are in Zone X. This helps us ask better outreach questions, but claim shares do not tell us a home’s flood probability.”'],
 ['1:10','Show the prediction','Open Predict damage. Keep Zone X and type 1, then 4, into the water depth. “Our model estimates a home’s damage before claims arrive. Water depth is the biggest driver, and low-risk zones still get hit hard.”'],
 ['1:30','Where help goes first','Point to the zip-code table. “If Harvey hit again, these are the zip codes recovery teams should reach first.” Then: “Our first model failed on Beryl, so we added water depth. The final model passes that test.”'],
 ['1:50','Close with the value','“Recovery Lens turns flood claims into a recovery plan: what happened, how much damage to expect, and where to send help first. More storms and data on every home are our next steps.”']
 ].map(([t,title,body])=>`<div class="pitch-step"><time>${t}</time><div><h3>${title}</h3><p>${body}</p></div></div>`).join('')}<button class="primary" data-open="explore">Start the demo →</button></article><article class="card panel"><h2>Answers you can give confidently</h2><h3>What did you build?</h3><p>A historical data explorer that compares assessed building damage in eligible flood insurance claims after major Houston storms.</p><h3>Where is the AI or data science?</h3><p>We cleaned and joined datasets, built a baseline and two predictive models, separated storms for training and testing, and checked the results. The final product uses descriptive analysis because the model did not generalize.</p><h3>Why reject the model?</h3><p>It predicted zero for every Beryl claim. A better score against one weak baseline did not make those predictions useful.</p><h3>Can it predict my damage or insurance payout?</h3><p>No. It shows historical assessed damage among selected insured claims. It does not know a home’s flood probability or its policy terms.</p><h3>What is a median?</h3><p>The middle amount: half the eligible records had less damage and half had more.</p><h3>What would you add next?</h3><p>More storms, data on all exposed properties, stronger baselines, and a fresh storm reserved for an independent test.</p><h3>Did you use AI assistance?</h3><p>“Yes. I used an AI coding assistant to help build the analysis and demo. I reviewed the results and can explain the data, testing, and limitations.”</p></article></section>`;}
function render(){
 document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 document.getElementById('app').innerHTML=state.page==='explore'?explore():state.page==='predict'?predict():state.page==='evidence'?evidence():present();
 document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();setPage(b.dataset.open)}));
 document.querySelectorAll('[data-storm]').forEach(b=>b.addEventListener('click',()=>{state.storm=b.dataset.storm;render()}));
 document.querySelectorAll('[data-county]').forEach(b=>{const choose=()=>{state.county=b.dataset.county;render()};b.addEventListener('click',choose);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}})});
 document.getElementById('county-select')?.addEventListener('change',e=>{state.county=e.target.value;render()});
 document.getElementById('zone-select')?.addEventListener('change',e=>{state.zone=e.target.value;render()});
 document.getElementById('export-button')?.addEventListener('click',()=>{const cols=['storm','year','county','claims','median_damage','mean_damage','total_recorded_damage','rain_total','gust_max','weather_start','weather_end'];
 const values=D.history.filter(r=>r.county===state.county);const csv=cols.join(',')+'\r\n'+values.map(r=>cols.map(c=>'"'+String(r.claims<20&&['median_damage','mean_damage','total_recorded_damage'].includes(c)?'SUPPRESSED_SMALL_SAMPLE':r[c]).replaceAll('"','""')+'"').join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download=state.county.replaceAll(' ','_')+'_historical_storm_comparison.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('download-status').textContent='Exported all-zone county comparison for all four storms.';});
 document.getElementById('print-button')?.addEventListener('click',()=>window.print());
 document.getElementById('est-storm')?.addEventListener('change',e=>{est.storm=e.target.value;render()});
 document.getElementById('est-county')?.addEventListener('change',e=>{est.county=e.target.value;render()});
 document.getElementById('est-zone')?.addEventListener('change',e=>{est.zone=e.target.value;render()});
 // typed values outside the trained range snap to the nearest limit
 document.getElementById('est-depth')?.addEventListener('change',e=>{const v=parseFloat(e.target.value);if(!isNaN(v))est.depth=Math.round(clamp(v,0,30)*10)/10;render()});
 document.getElementById('est-coverage')?.addEventListener('change',e=>{const v=parseFloat(e.target.value);if(!isNaN(v))est.coverage=Math.round(clamp(v,10000,250000));render()});
}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();setPage('explore')});
if(!D||!GEO||!P)document.getElementById('app').innerHTML='<p>Data could not load. Open the complete project folder or reload the hosted demo.</p>';else render();
</script>
