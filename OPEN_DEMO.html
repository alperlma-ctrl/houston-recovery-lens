// blend the four saved predictions around the typed depth and coverage
function estimate(){
 const pick=(list,v)=>{let i=0;while(i<list.length-2&&v>list[i+1])i++;return [i,(v-list[i])/(list[i+1]-list[i])];};
 const [di,dt]=pick(P.depths,est.depth),[ci,ct]=pick(P.coverages,est.coverage);
 const at=(d,c)=>{const g=P.grid.find(r=>r[0]===est.storm&&r[1]===est.county&&r[2]===est.zone&&r[3]===P.depths[d]&&r[4]===P.coverages[c]);return g?g[5]:null;};
 const v00=at(di,ci),v10=at(di+1,ci),v01=at(di,ci+1),v11=at(di+1,ci+1);
 if([v00,v10,v01,v11].includes(null))return null;
 return (v00*(1-dt)+v10*dt)*(1-ct)+(v01*(1-dt)+v11*dt)*ct;
}
function estimateView(){
 const hist=row(est.storm,est.county),claims=hist?hist.claims:0;
 if(claims<MIN_EST_CLAIMS)return {value:'Not enough data',note:`Only ${num(claims)} ${est.storm} claims in ${est.county} County, too few to estimate. Try another storm or county.`,history:''};
 const value=estimate();
 return {value:value==null?'—':money(value),note:`${est.depth} ft of water · ${money(est.coverage)} coverage`,
  history:`Recorded median for ${est.county} after ${est.storm}, all depths: ${money(hist.median_damage)} across ${num(claims)} claims`};
}

// read a typed number: blank or non-numbers keep the last good value, out-of-range values use the nearest limit
function readNumber(input,lo,hi,label,unit){
 const v=parseFloat(input.value);
 if(input.value.trim()===''||isNaN(v))return {value:null,message:`Enter a ${label} from ${unit(lo)} to ${unit(hi)}.`};
 const used=clamp(v,lo,hi);
 return {value:used,message:used===v?'':`Using ${unit(used)}, the ${used===hi?'highest':'lowest'} ${label} in our data.`};
}

function evidence(){const m=D.metrics,a=D.audit;
 return `<div class="page-intro"><div class="eyebrow">EVIDENCE BEFORE ESTIMATES</div><h1>A model should earn<br>your confidence.</h1><p>Our first model left out water depth. We trained it on Harvey and Imelda, chose it using Nicholas, then tested it on Beryl, and it failed. That failure told us what was missing. The final model on the Predict damage page adds water depth and passes the Beryl test.</p></div><div class="warning"><strong>First model rejected</strong>Every Beryl prediction was clipped to $0. Its lower error against a $68,509 training-median baseline was misleading: predicting zero produced the same result. These outputs are archived for inspection. <a href="#predict" data-open="predict">See the final model →</a></div>
 <section class="evidence-grid"><article class="card panel"><span class="source-tag">01 · MODEL DESIGN</span><h2 style="margin-top:16px">Separate storms, separate roles</h2><div class="split"><div><strong>Train</strong><small>Harvey + Imelda<br>${num(m.train_n)} claims</small></div><div><strong>Select</strong><small>Nicholas 2021<br>${num(m.validation_n)} claims</small></div><div><strong>Test</strong><small>Beryl 2024<br>${num(m.test_n)} claims</small></div></div><p>The target was assessed building damage per eligible claim. Inputs were county, recorded flood zone, insurance coverage, total window rainfall, and peak wind gust. Training weights gave Harvey and Imelda equal total influence.</p><p>We excluded payouts, assessed damage, loss dates, storm names, and reported indoor water depth from the input features. We joined weather to claims once per storm and county using a validated many-to-one join.</p><p><strong>Important:</strong> Full-window historical weather makes this a retrospective experiment. It is not a forecast backtest.</p></article>
 <article class="card panel"><span class="source-tag">02 · VALIDATION</span><h2 style="margin-top:16px">What the numbers actually say</h2><table class="evidence-table"><thead><tr><th>Candidate</th><th>Nicholas average error</th></tr></thead><tbody>${m.validation_candidates.map(x=>`<tr><td>${escapeText(x.model)}</td><td>${money(x.mae)}</td></tr>`).join('')}</tbody></table><table class="evidence-table"><thead><tr><th>Beryl final check</th><th>Result</th></tr></thead><tbody><tr><td>Ridge average absolute error</td><td>${money(m.test_model.mae)}</td></tr><tr><td>Training-median baseline error</td><td>${money(m.test_baseline.mae)}</td></tr><tr><td>Always-zero diagnostic error</td><td>${money(m.zero_prediction_baseline_mae)}</td></tr><tr><td>Ridge predictions clipped to zero</td><td>${pct(m.test_zero_prediction_share)}</td></tr><tr><td>R² on Beryl</td><td>${m.test_model.r2.toFixed(3)}</td></tr></tbody></table><p>A negative R² and collapsed outputs are reasons to reject the model. The 61% reduction against the training-median baseline is not evidence of useful prediction.</p></article>
 <article class="card panel"><span class="source-tag">03 · DATA QUALITY</span><h2 style="margin-top:16px">From source records to usable evidence</h2><table class="evidence-table"><tbody><tr><td>All supplied claim records</td><td>${num(a.raw_claims)}</td></tr><tr><td>Four storms, single-family claims</td><td>${num(a.selected_single_family_claims)}</td></tr><tr><td>Missing damage in that group</td><td>${num(a.missing_damage_in_selected)}</td></tr><tr><td>Final eligible records</td><td>${num(a.model_claims)}</td></tr><tr><td>County and storm weather groups</td><td>${a.weather_groups}</td></tr><tr><td>Hourly weather rows</td><td>${num(a.weather_rows)}</td></tr></tbody></table><p>Missing damage stays missing and is excluded. County FIPS are five-character strings. Occupancy codes 1 and 11 are combined as single-family homes. Exact duplicate checks were run, but no unique property or claim ID was supplied.</p><p>All four organizer files were inspected. Hurricane tracks provide historical context; the nine-county boundary file supports the map. Neither file is used as an extra damage label.</p></article>
 <article class="card panel"><span class="source-tag">04 · PRACTICAL LIMITS</span><h2 style="margin-top:16px">Use the record with care</h2><ul>${D.limitations.map(x=>`<li>${escapeText(x)}</li>`).join('')}</ul><p><strong>Next experiment:</strong> Obtain more independent storms, consistent exposure data, property characteristics, and forecast-time weather. Test against stronger baselines and retain a fresh storm for final evaluation.</p></article><article class="card panel wide"><h3>Sources and reproducibility</h3><p>Data supplied in the organizer’s shared folder on October 23, 2026. The brief attributes the claims to OpenFEMA, weather to Open-Meteo ERA5, tracks to NOAA IBTrACS, and boundaries to the U.S. Census Bureau. The downloadable project includes source-file hashes, cleaning rules, fitted models, metrics, and the analysis notebook.</p><div class="links"><a href="${D.sources.folder}" target="_blank" rel="noopener">Shared source folder ↗</a><a href="${D.sources.brief}" target="_blank" rel="noopener">Organizer dataset brief ↗</a><a href="https://scikit-learn.org/stable/modules/model_evaluation.html" target="_blank" rel="noopener">Metric definitions ↗</a></div></article></section>`;
